name: Verify published intelligence update once
on:
  push:
    branches: ['codex/deploy-intelligence-once']
    paths: ['.github/workflows/deploy-intelligence-once.yml']
permissions:
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compare Hostinger briefing with committed output
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          expected = json.loads(Path("higher-ed-intel/data/latest.json").read_text(encoding="utf-8"))
          assert expected["cadence"] == "Monday / Wednesday / Friday"
          assert "Early College and dual enrollment" in expected["focus"]
          last_error = None
          for attempt in range(6):
              try:
                  url = "https://merder.org/higher-ed-intel/data/latest.json?verify=" + str(int(time.time()))
                  request = Request(url, headers={"Cache-Control": "no-cache"})
                  with urlopen(request, timeout=20) as response:
                      actual = json.load(response)
                  for field in ("generated_at", "cycle_date", "cadence", "top_signals", "priority_coverage"):
                      assert actual[field] == expected[field], f"Published {field} differs from committed output"
                  print("PUBLICATION VERIFIED")
                  print(json.dumps({key: actual.get(key) for key in ("generated_at", "cycle_date", "cadence", "priority_coverage")}))
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt < 5:
                      time.sleep(10)
          else:
              raise RuntimeError(f"Public verification failed: {last_error}")
          PY
